load_module modules/ngx_otel_module.so;

user  nginx;
worker_processes  1;
error_log  /dev/stderr info;
pid        /run/nginx.pid;

events { worker_connections  1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;

    # Trazas de nginx hacia el recolector (OTLP por gRPC). host.docker.internal es la máquina que publica el puerto.
    otel_exporter {
        endpoint host.docker.internal:48417;
        interval 1s;
    }
    otel_service_name nginx-web;
    otel_trace on;
    otel_trace_context propagate;      # lee traceparent si viene, crea el tramo de nginx y lo propaga a la API

    include /etc/nginx/conf.d/*.conf;
}
