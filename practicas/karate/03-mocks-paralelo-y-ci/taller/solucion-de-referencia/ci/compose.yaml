# Bitácora para la integración continua: construye la imagen de la API (el Servidor.java de la carpeta api/ de este repositorio) y publica PUERTO_CI (por defecto 8081).
# La clave llega de fuera: CLAVE_CI=<clave> docker compose up -d --build --wait
services:
  api:
    build:
      context: ${CONTEXTO_API:-../api}
      dockerfile_inline: |
        FROM eclipse-temurin:21-jdk
        WORKDIR /app
        COPY Servidor.java .
        RUN javac -d clases Servidor.java
        CMD ["java", "-cp", "clases", "Servidor"]
    environment:
      CLAVE_API: ${CLAVE_CI:?define CLAVE_CI}
      VERSION: 1.0.0
    ports:
      - "${PUERTO_CI:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/salud/listo || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
