# Bitácora en un contenedor: el ambiente "contenedor" de la suite. Otro puerto y otra clave que el local.
# La clave no vive aquí: CLAVE_CONTENEDOR=<clave> docker compose up -d --build
services:
  api:
    build:
      context: ../../../../../docker-kubernetes/app/api
      dockerfile_inline: |
        FROM eclipse-temurin:21-jdk
        WORKDIR /app
        COPY Servidor.java .
        RUN javac -d clases Servidor.java
        CMD ["java", "-cp", "clases", "Servidor"]
    environment:
      CLAVE_API: ${CLAVE_CONTENEDOR:?define CLAVE_CONTENEDOR con la clave del ambiente contenedor}
      MENSAJE: Hola desde el contenedor
      VERSION: 1.0.0
    ports:
      - "48081:8080"
