# PostgreSQL 17 con la base "tienda" para arrancar la aplicación (las pruebas usan Testcontainers y no lo necesitan).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tienda
      POSTGRES_USER: banco
      POSTGRES_PASSWORD: banco
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banco -d tienda"]
      interval: 5s
      timeout: 3s
      retries: 10
