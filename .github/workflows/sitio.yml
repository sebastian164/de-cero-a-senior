# Construye el sitio del curso (MkDocs Material) y lo publica en GitHub Pages.
# Requiere: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Una sola publicación a la vez; no se cancela la que está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Material avisa del futuro MkDocs 2.0 en cada construcción; el aviso no aporta nada aquí.
  NO_MKDOCS_2_WARNING: "true"

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sitio/requirements.txt

      - name: Instalar dependencias
        run: pip install -r sitio/requirements.txt

      # --strict: cualquier enlace roto o advertencia hace fallar la construcción.
      - name: Construir el sitio
        run: mkdocs build --strict -f sitio/mkdocs.yml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio/site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
