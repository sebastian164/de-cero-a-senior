# Taller 06: tres copias sin volumen (el defecto de diseño)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitacora-api
  labels: {app: bitacora-api}
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels: {app: bitacora-api}
  template:
    metadata:
      labels: {app: bitacora-api}
    spec:
      containers:
        - name: api
          image: bitacora-api:1.0.0
          env:
            - {name: DIRECTORIO_DATOS, value: /datos}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /salud/listo, port: http}
            periodSeconds: 1

---
apiVersion: v1
kind: Service
metadata:
  name: bitacora-api
spec:
  selector: {app: bitacora-api}
  ports:
    - {name: http, port: 80, targetPort: http}
