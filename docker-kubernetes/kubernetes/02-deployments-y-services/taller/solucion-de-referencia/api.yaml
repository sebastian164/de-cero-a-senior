apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitacora-api
  namespace: bitacora
  labels:
    app: bitacora-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bitacora-api
  template:
    metadata:
      labels:
        app: bitacora-api
    spec:
      containers:
        - name: api
          image: bitacora-api:1.0.0
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: bitacora-api
  namespace: bitacora
spec:
  selector:
    app: bitacora-api
  ports:
    - name: http
      port: 80
      targetPort: http
