apiVersion: v1
kind: Namespace
metadata:
  name: bitacora
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitacora-api
  namespace: bitacora
  labels: {app: bitacora-api}
spec:
  replicas: 3
  selector:
    matchLabels: {app: bitacora-api}
  template:
    metadata:
      labels: {app: bitacora-api}
    spec:
      containers:
        - name: api
          image: bitacora-api:1.0.0
          env:
            - {name: VERSION, value: "1.0.0"}
            - {name: ESPERA_APAGADO_MS, value: "5000"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /salud/listo, port: http}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /salud/vivo, port: http}
          lifecycle:
            preStop:
              sleep: {seconds: 5}
---
apiVersion: v1
kind: Service
metadata:
  name: bitacora-api
  namespace: bitacora
spec:
  selector: {app: bitacora-api}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitacora-web
  namespace: bitacora
  labels: {app: bitacora-web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: bitacora-web}
  template:
    metadata:
      labels: {app: bitacora-web}
    spec:
      containers:
        - name: web
          image: bitacora-web:0.1.0
          env:
            - {name: DESTINO_API, value: "http://bitacora-api"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /, port: http}
---
apiVersion: v1
kind: Service
metadata:
  name: bitacora-web
  namespace: bitacora
spec:
  selector: {app: bitacora-web}
  ports:
    - {name: http, port: 80, targetPort: http}
