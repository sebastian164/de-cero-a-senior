# Paso 8, al final: la versión nueva ya es la única. El Service estable bitacora-api (que la web usa en DESTINO_API) pasa a
# seleccionar los pods de la 2.0.0 (ver servicio-final.yaml) y la ruta vuelve a una sola regla para /api.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bitacora
  namespace: bitacora
spec:
  parentRefs:
    - name: entrada
  hostnames:
    - bitacora.localhost
  rules:
    - matches:
        - path: {type: Exact, value: /notas}
      filters:
        - type: RequestRedirect
          requestRedirect:
            path: {type: ReplaceFullPath, replaceFullPath: /}
            statusCode: 302
    - matches:
        - path: {type: PathPrefix, value: /api}
      backendRefs:
        - {name: bitacora-api, port: 80}
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: bitacora-web, port: 80}
