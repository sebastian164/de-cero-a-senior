# Paso 11: una cuenta que solo puede leer ConfigMaps de su espacio de nombres.
apiVersion: v1
kind: ServiceAccount
metadata: {name: lector-de-configuracion, namespace: bitacora-08}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: leer-configmaps, namespace: bitacora-08}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: lector-de-configuracion, namespace: bitacora-08}
subjects:
  - {kind: ServiceAccount, name: lector-de-configuracion, namespace: bitacora-08}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: leer-configmaps}
