apiVersion: v1
kind: ConfigMap
metadata:
  name: caso-7
  namespace: averiado
data:
  MENSAJE: Caso siete
  VERSION: 1.0.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caso-7
  namespace: averiado
spec:
  replicas: 2
  selector:
    matchLabels:
      app: caso-7
  template:
    metadata:
      labels:
        app: caso-7
    spec:
      containers:
        - name: api
          image: bitacora-api:1.0.0
          env:
            - name: MENSAJE
              valueFrom:
                configMapKeyRef:
                  name: caso-7
                  key: MENSAGE
            - name: VERSION
              valueFrom:
                configMapKeyRef:
                  name: caso-7
                  key: VERSION
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /salud/listo
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: caso-7
  namespace: averiado
spec:
  selector:
    app: caso-7
  ports:
    - name: http
      port: 80
      targetPort: http
