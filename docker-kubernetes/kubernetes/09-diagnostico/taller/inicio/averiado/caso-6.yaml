apiVersion: apps/v1
kind: Deployment
metadata:
  name: caso-6
  namespace: averiado
spec:
  replicas: 2
  selector:
    matchLabels:
      app: caso-6
  template:
    metadata:
      labels:
        app: caso-6
    spec:
      containers:
        - name: api
          image: bitacora-api:1.0.0
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /salud/listo
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /salud/viva
              port: http
            periodSeconds: 5
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: caso-6
  namespace: averiado
spec:
  selector:
    app: caso-6
  ports:
    - name: http
      port: 80
      targetPort: http
