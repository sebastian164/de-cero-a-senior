apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pedidos
  template:
    metadata:
      labels:
        app: pedidos
    spec:
      containers:
        - name: pedidos
          image: ghcr.io/ejemplo/pedidos:2.3.1
          envFrom:
            - configMapRef:
                name: pedidos-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pedidos-db
                  key: password
