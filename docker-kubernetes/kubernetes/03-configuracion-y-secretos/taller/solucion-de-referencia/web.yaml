apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitacora-web
  labels:
    app: bitacora-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bitacora-web
  template:
    metadata:
      labels:
        app: bitacora-web
    spec:
      containers:
        - name: web
          image: bitacora-web:0.1.0
          envFrom:
            - configMapRef:
                name: bitacora-web-config      # destino de la API en el ConfigMap
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: bitacora-web
spec:
  selector:
    app: bitacora-web
  ports:
    - name: http
      port: 80
      targetPort: http
