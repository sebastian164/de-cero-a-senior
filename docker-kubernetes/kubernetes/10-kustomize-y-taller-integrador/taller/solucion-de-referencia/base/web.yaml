apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitacora-web
  labels: {app: bitacora-web}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: bitacora-web}
  template:
    metadata:
      labels: {app: bitacora-web}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: bitacora-web
          env:
            - {name: DESTINO_API, value: "http://bitacora-api"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /run}
      volumes:
        - {name: conf, emptyDir: {}}
        - {name: cache, emptyDir: {}}
        - {name: run, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: bitacora-web
spec:
  selector: {app: bitacora-web}
  ports:
    - {name: http, port: 80, targetPort: http}
