apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: entrada
spec:
  gatewayClassName: eg
  listeners:
    - {name: http, protocol: HTTP, port: 80, allowedRoutes: {namespaces: {from: Same}}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bitacora
spec:
  parentRefs: [{name: entrada}]
  hostnames: [bitacora.localhost]
  rules:
    - matches: [{path: {type: PathPrefix, value: /api}}]
      backendRefs: [{name: bitacora-api, port: 80}]
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: bitacora-web, port: 80}]
