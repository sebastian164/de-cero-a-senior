apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bitacora-api
spec:
  minAvailable: 2
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels: {app: bitacora-api}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bitacora-web
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels: {app: bitacora-web}
