apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bitacora-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: bitacora-api}
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 50}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60     # en producción real sería de minutos; aquí baja rápido para poder medirlo
