apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bitacora-prod
resources:
  - ../../base
  - espacio-de-nombres.yaml
  - autoescalado.yaml
  - presupuesto.yaml
  - politicas-de-red.yaml
images:
  - {name: bitacora-api, newTag: 1.0.1}
  - {name: bitacora-web, newTag: 0.1.0}
# Sin "replicas" para la API: la gobierna el autoescalador (mínimo 3).
replicas:
  - {name: bitacora-web, count: 2}
configMapGenerator:
  - name: bitacora-api-config
    behavior: merge
    literals:
      - MENSAJE=Bitácora en producción
      - VERSION=1.0.1
patches:
  - path: recursos.yaml
