# Paso 10: el compose del entorno con los datos en un volumen con nombre.
# Configurada solo con variables de entorno, la imagen apache/kafka deja los registros en el valor por
# defecto de Kafka (/tmp/kafka-logs), dentro del contenedor: "down" borra el contenedor y con él los temas.
# Aquí se fija KAFKA_LOG_DIRS y se monta un volumen con nombre: "down" (sin -v) los conserva.
services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "47192:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:47192
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
      # Solo para el paso 8: revisar la retención cada 5 s en lugar de cada 5 min
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: ${CHEQUEO_RETENCION_MS:-300000}
    volumes:
      - datos-kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

volumes:
  datos-kafka:
