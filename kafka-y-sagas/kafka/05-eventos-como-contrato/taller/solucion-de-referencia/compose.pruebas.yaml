# Infraestructura de las pruebas de esta solución.
# Misma imagen y misma configuración que kafka-y-sagas/entorno/compose.yaml; solo cambian el puerto publicado
# (47092 en lugar de 9092, para no chocar con tu entorno), la dirección anunciada y el tamaño del montón.
# Arriba:  docker compose -p pub-kafka-y-sagas -f compose.pruebas.yaml up -d --wait
# Abajo:   docker compose -p pub-kafka-y-sagas -f compose.pruebas.yaml down -v
services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "47092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:47092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms384m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  postgres:
    image: postgres:17
    ports:
      - "47432:5432"
    environment:
      POSTGRES_USER: taller
      POSTGRES_PASSWORD: taller
      POSTGRES_DB: taller
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=64MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taller"]
      interval: 3s
      timeout: 5s
      retries: 30

  # Registro de esquemas de la sesión 05 (taller, paso 10). En memoria: sin datos que conservar.
  registro:
    image: apicurio/apicurio-registry:3.3.4
    ports:
      - "47081:8080"
    environment:
      JAVA_OPTS_APPEND: "-Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/apis/registry/v3/system/info > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
