name: taller-seguridad-keycloak
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-curso.json:/opt/keycloak/data/import/realm-curso.json:ro
    ports:
      - "42180:8080"
