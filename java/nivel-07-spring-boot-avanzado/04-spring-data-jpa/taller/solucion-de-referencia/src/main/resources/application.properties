spring.main.banner-mode=off
spring.datasource.url=${pg.url:jdbc:postgresql://localhost:5432/taller}?currentSchema=n704
spring.datasource.username=curso
spring.datasource.password=curso
spring.jpa.hibernate.ddl-auto=create
# Taller 1: registro de SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.session_factory.statement_inspector=jpa.RegistroSql
# Taller 2: Open Session in View desactivado
spring.jpa.open-in-view=false
spring.sql.init.mode=always
