# PostgreSQL para las pruebas. Puerto del anfitrión configurable: PG_PORT=5433 docker compose up -d --wait
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: taller
      POSTGRES_USER: curso
      POSTGRES_PASSWORD: curso
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curso -d taller"]
      interval: 2s
      timeout: 3s
      retries: 30
