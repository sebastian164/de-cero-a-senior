server:
  port: 43091
  tomcat.threads.max: 10          # pocos hilos para que el agotamiento se vea con pocas peticiones
spring:
  application.name: servicio
dep:
  critico: http://localhost:43093
  recomendaciones: http://localhost:43094
  resenas: http://localhost:43095
management:
  endpoints.web.exposure.include: health,metrics,circuitbreakers
  endpoint.health.show-details: always
resilience4j:
  circuitbreaker.instances:
    recomendaciones:
      failure-rate-threshold: 50
      sliding-window-size: 10
      minimum-number-of-calls: 5
      wait-duration-in-open-state: 2s
      permitted-number-of-calls-in-half-open-state: 2
      automatic-transition-from-open-to-half-open-enabled: true
      record-exceptions: [java.lang.Exception]
    resenas:
      failure-rate-threshold: 50
      sliding-window-size: 10
      minimum-number-of-calls: 5
      wait-duration-in-open-state: 2s
  bulkhead.instances.recomendaciones:
    max-concurrent-calls: 3
    max-wait-duration: 0
