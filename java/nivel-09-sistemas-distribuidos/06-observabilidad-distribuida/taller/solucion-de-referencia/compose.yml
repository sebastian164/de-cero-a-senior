# Infraestructura de la solución. Levantar: docker compose up -d --wait   Bajar: docker compose down -v
name: taller-n9-06

services:
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:43092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:43092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    ports: ["43092:43092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:43092 --list >/dev/null 2>&1"]
      interval: 3s
      retries: 40

  # Collector de OpenTelemetry, Tempo, Prometheus, Loki y Grafana en una sola imagen.
  lgtm:
    image: grafana/otel-lgtm:0.40.0
    container_name: lgtm-n9-06
    ports:
      - "43300:3000"
      - "43317:4317"
      - "43318:4318"
      - "43200:3200"
      - "43090:9090"
    volumes:
      - ./infra/alertas.yml:/otel-lgtm/alertas-curso.yml:ro
      - ./infra/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health && curl -sf http://localhost:3200/ready && curl -sf http://localhost:9090/-/ready"]
      interval: 3s
      retries: 60
