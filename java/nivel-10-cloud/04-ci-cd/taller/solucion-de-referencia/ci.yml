name: n10-04-ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: ./mvnw -B verify                    # compila y ejecuta todas las pruebas

  analizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - name: Análisis estático (todas las advertencias del compilador como error)
        run: ./mvnw -B -q -DskipTests -Dmaven.compiler.showWarnings=true "-Dmaven.compiler.compilerArgument=-Xlint:all,-processing -Werror" compile
      - name: Dependencias con vulnerabilidades conocidas (HIGH y CRITICAL) - si hay alguna, el trabajo falla
        run: |
          ./mvnw -B -q dependency:copy-dependencies -DoutputDirectory=target/libs
          ls target/libs | wc -l
          # Los JAR se copian a un volumen con "docker cp" (en vez de montar $PWD): así funciona igual en un ejecutor de GitHub y en act.
          # Se usa "rootfs": con "fs" Trivy no analiza archivos .jar sueltos y el informe sale vacío ("Not scanned") sin fallar.
          trap 'docker rm -vf libs-ci >/dev/null 2>&1 || true' EXIT
          docker rm -f libs-ci >/dev/null 2>&1 || true
          docker create --name libs-ci -v /libs busybox >/dev/null
          docker cp target/libs/. libs-ci:/libs
          # La caché de las bases de datos de vulnerabilidades (1,6 GB + 1,5 GB) es persistente: en GitHub, un volumen con nombre; en el taller local,
          # una carpeta del anfitrión (TRIVY_CACHE) que se precalienta antes. TRIVY_OPCIONES="--skip-db-update --skip-java-db-update" evita volver a descargarlas.
          docker run --rm --volumes-from libs-ci -v "${TRIVY_CACHE:-trivy-cache}:/root/.cache/trivy" aquasec/trivy:0.76.2 rootfs -q --scanners vuln --severity HIGH,CRITICAL --exit-code 1 ${TRIVY_OPCIONES:-} /libs

  migraciones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: ./mvnw -B -q -DskipTests package
      - name: PostgreSQL vacío (en GitHub sería un "services:"; en act se publica en un puerto del anfitrión)
        run: |
          docker rm -f bd-ci >/dev/null 2>&1 || true
          docker run -d --name bd-ci -p 127.0.0.1:${PUERTO_BD_CI:-5433}:5432 -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=tienda postgres:16 >/dev/null
          for i in $(seq 1 30); do docker exec bd-ci pg_isready -U postgres -d tienda >/dev/null 2>&1 && break; sleep 1; done
          sleep 3
      - name: Aplicar las migraciones Flyway desde cero y comprobar el esquema
        run: |
          SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:${PUERTO_BD_CI:-5433}/tienda SPRING_DATASOURCE_USERNAME=postgres \
          SPRING_DATASOURCE_PASSWORD=ci SERVER_PORT=8081 java -jar target/pedidos-*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8081/actuator/health/readiness >/dev/null && break; sleep 1; done
          grep -E "Successfully applied|Migrating schema" app.log
          curl -sf -XPOST localhost:8081/api/pedidos -H 'Content-Type: application/json' -d '{"clienteId":1,"total":5}'
          echo
          docker exec bd-ci psql -U postgres -d tienda -tAc "select version, success from flyway_schema_history"
      - name: Limpiar
        if: always()
        run: docker rm -f bd-ci >/dev/null

  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen (la misma que se desplegará)
        run: docker build -t registro.example/pedidos:${{ github.sha }} .
