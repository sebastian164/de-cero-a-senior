# Expone el Service en el puerto 30081 de los nodos de kind; kind lo publica en el anfitrión (PUERTO_SERVICIO, 8081 por defecto).
apiVersion: v1
kind: Service
metadata:
  name: pedidos-externo
spec:
  type: NodePort
  selector: { app: pedidos }
  ports: [{ port: 80, targetPort: 8080, nodePort: 30081 }]
