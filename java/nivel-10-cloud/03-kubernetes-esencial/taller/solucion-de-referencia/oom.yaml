# Pod con el error clásico: montón fijo (-Xmx) por encima del límite de memoria del contenedor.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos-oom
spec:
  replicas: 1
  selector:
    matchLabels: { app: pedidos-oom }
  template:
    metadata:
      labels: { app: pedidos-oom }
    spec:
      containers:
        - name: pedidos
          image: registro.example/pedidos:1.4.2
          envFrom:
            - configMapRef: { name: pedidos-config }
            - secretRef: { name: pedidos-secretos }
          env:
            - { name: JAVA_TOOL_OPTIONS, value: "-Xmx1g" }
          resources:
            requests: { cpu: 100m, memory: 300Mi }
            limits: { memory: 300Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
