# Infraestructura de la solución. Levantar: docker compose up -d --wait   Bajar: docker compose down -v
name: taller-n8-04

services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_USER: curso
      POSTGRES_PASSWORD: curso
      POSTGRES_DB: curso
    command: ["postgres", "-c", "max_connections=300", "-c", "deadlock_timeout=200ms"]
    ports: ["43432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curso -d curso"]
      interval: 2s
      retries: 30
