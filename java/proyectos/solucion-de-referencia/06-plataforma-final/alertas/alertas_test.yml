rule_files: [alertas-tienda.yml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="tienda",status="200"}'
        values: '0+90x10'
      - series: 'http_server_requests_seconds_count{application="tienda",status="503"}'
        values: '0+10x10'
      - series: 'resilience4j_circuitbreaker_state{application="tienda",name="pasarela",state="open"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: TiendaErroresAltos
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: "Más del 2 % de las peticiones a la tienda responde 5xx"
              runbook: |
                1. Mitigar: si hubo un despliegue reciente, kubectl rollout undo deployment/tienda.
                2. Mirar /actuator/circuitbreakers: si 'pasarela' está OPEN, el problema es la pasarela de pagos, no la tienda.
                3. Revisar pedidos RECHAZADOS por motivo (SELECT motivo, count(*) FROM pedidos_pedidos GROUP BY 1).
                4. Comunicar en el canal del incidente.
      - eval_time: 8m
        alertname: TiendaPasarelaCortada
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: "El cortacircuitos de la pasarela de pagos lleva un minuto abierto: no se están cobrando pedidos"
              runbook: |
                1. Confirmar con el proveedor de la pasarela si hay incidente; si es nuestro, revisar red y credenciales.
                2. Mientras tanto los pedidos se rechazan rápido y el inventario se libera: no hay que corregir datos.
                3. Cuando la pasarela vuelva, el cortacircuitos pasa a semiabierto solo (2 s en la prueba, configurable).
