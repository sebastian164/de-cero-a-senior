# PostgreSQL y Kafka para ejecutar la tienda a mano. Las pruebas NO los necesitan: usan Testcontainers.
#   docker compose up -d --wait     levanta PostgreSQL (5432) y Kafka (9092)
#   docker compose down -v          los baja y borra los datos
# Si un puerto está ocupado en tu equipo: PG_PUERTO=5433 KAFKA_PUERTO=9093 docker compose up -d --wait
# (y ajusta TIENDA_DB_URL y KAFKA_SERVIDORES al ejecutar la tienda).
name: tienda

services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_USER: tienda
      POSTGRES_PASSWORD: tienda
      POSTGRES_DB: tienda
    ports: ["${PG_PUERTO:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tienda -d tienda"]
      interval: 2s
      retries: 30

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:${KAFKA_PUERTO:-9092},CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PUERTO:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    ports: ["${KAFKA_PUERTO:-9092}:${KAFKA_PUERTO:-9092}"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:${KAFKA_PUERTO:-9092} --list >/dev/null 2>&1"]
      interval: 3s
      retries: 40
